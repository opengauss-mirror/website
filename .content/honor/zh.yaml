          - "4. 社区中提出的问题进行RCA分析并提取测试用例。 1. 积极参与在社区的YAT仓、QA仓以及server仓的贡献。每个功能的验证又在docs仓中查询文档是否与实际功能相符，维护docs仓对应文档的准确性。"
