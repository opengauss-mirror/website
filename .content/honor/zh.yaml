# honor_list: 按年份分组的荣誉数据
#   id: 年份
#   data: 荣誉证书列表
#     name: 荣誉名称
#     href: 新闻链接（空字符串表示无链接）
#     img: 证书图片（空字符串表示无图片）
#   developer_data: 年度优秀开发者列表
#     name: 奖项名称
#     members: 开发者列表
#       name: 姓名
#       company: 公司
#       show_email: 是否显示邮箱
#       email: 邮箱
#       avatar: 头像图片
#   devoloper_rules: 评选规则
#     type: 规则类型（tip/label）
#     value: 规则文案
#   sig_data: 优秀SIG列表
#     name: SIG名称
#     href: 项目地址
#   sig_rules: SIG评选规则
#   enterprise_data: 优秀企业列表
#     first_name: 企业名（第一部分）
#     second_name: 企业名（第二部分）
#   enterprise_rules: 企业评选规则
#   person_data: 优秀个人贡献奖列表
#     name: 姓名
#     company: 公司
#     avatar: 头像
#     comment: 贡献描述（数组，可含 link: 前缀的链接）
#   person_rules: 个人评选规则
#   excellent_enterprise_title: 优秀企业标题
#   excellent_person_title: 优秀个人标题
