          - "- 结合海量数据客户业务场景，致力于推动openGauss社区的技术创新与实践，与开发团队合作，探索并联合开发功能特性，本年度完成资源池化、发布订阅、兼容性、高可用、基础算子性能优化等多个新特合入海量商业版本。并推动客户使用。"
          - "- 在5.0.0LTS版本发布时期，积极参与社区bug清理工作，组织公司内部研发人员进行bug修复，将DI值降到规定值以下，保证了LTS版本按期发布。"
      - name: "杨子浩"
        company: "国创中心"
        avatar: "./images/2023_yangzihao.png"
        comment:
          - "主要负责openGauss DataKit平台智能运维相关插件主要的需求分析、技术方案设计评审、项目管理及部分核心代码开发，其中包括实例监控插件、日志检索插件、告警监控插件和智能诊断插件。本年度提交PR18个，解决issue11个，提交issue12个，贡献特性包括330/930/1230版本的需求分析、核心方案设计与前端开发及后端开发。"
      - name: "曾色亮"
