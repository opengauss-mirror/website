    excellent_person_title: "openGauss 优秀个人贡献奖"
    person_data:
      - name: "赵晓琳"
        company: "海量数据"
        avatar: "./images/2023_zhaoxiaolin.png"
        comment:
          - "近一年社区贡献234次，解决了26个各类issue，与社区联合开发MySQL兼容性多个特性，包括创建触发器语法，删除触发器语法，异常处理语法，GET DIAGNOSTICS语法，@变量的递归调用语法等，积极参与社区评审会议，根据评审意见修改完善代码实现。并在开发和使用过程中发现提出和修复多个社区代码缺陷。"
      - name: "岳行之"
        company: "华为"
        avatar: "./images/2023_yuexingzhi.png"
        comment:
          - "Sig组例会记录："
          - "link: https://space.bilibili.com/543286270/search/video?keyword=SQL"
          - "代码检视记录："
          - "link: https://gitcode.com/opengauss/openGauss-server/pulls?assignee_id=&author_id=&label_ids=207105028&label_text=&milestone_id=&priority=&project_type=&scope=&search=&single_label_id=&single_label_text=&sort=closed_at+desc&status=merged&target_project=&tester_id="
      - name: "李居东"
        company: "华为"
        avatar: "./images/2023_lijudong.png"
        comment:
          - "作为openGauss SQLEngine Commiter，积极参与SQL引擎SIG组需求设计评审，issue解答，提出若干有效意见；参与社区代码检视工作："
          - "1. 设计和开发兼容MySQL高阶内核特性多字符集等需求，提升社区语法兼容度。"
          - "2. 积极响应客户问题，及时处理并闭环，修复多个issue。"
          - "3. 积极参与社区pr检视，全方位贡献个人力量。"
      - name: "盖立兵"
        company: "南大通用"
        avatar: "./images/2023_gailibing.png"
        comment:
          - "oracle到openGauss全量迁移数据类型映射贡献"
      - name: "窦欣"
        company: "华为"
        avatar: "./images/2023_douxin.png"
        comment:
          - "1. 完成增量迁移3w tps，迁移工具适配内核兼容性，全量迁移支持csv格式，迁移工具支持并行索引、表压缩等特性，强化了MySQL迁移工具的能力，助力客户实现20+应用从MySQL迁移至openGauss数据库。"
          - "2. 社区提交pr75个，修复issue76个。"
          - "3. 作为tools sig committer，参与社区 tools sig代码检视，累计输出260+检视意见。"
          - "4. 参与布道师活动，B站直播MySQL增量迁移、MySQL全流程迁移，参与ODD及HC大会迁移demo，参与openGauss数据库创新实践课，完成迁移沙箱实验，openGauss训练营课程，输出HCIP-openGauss认证相关迁移课程及实验。"
          - "5. 参与openGauss tools sig公共事务，组织例会，收集议题，发送评审会议纪要。"
      - name: "郭欢"
        company: "恩墨"
        avatar: "./images/2023_guohuan.png"
        comment:
          - "参与openGauss 5.0.0资料大纲重构，完成数据库运维指南+配置运行参数文件调整，参与docs sig组双周例会，统计社区issue和pr情况，完成committer工作汇报，向docs仓提交openGauss部署及使用过程中与文档相关的issue，提交PR处理文档中存在的问题，包括内容及图片缺失、链接失效、格式问题等，并向blog仓提交技术文章，日常协助审核合并仓库中的PR。docs仓提交26个issue，docs仓提交91个pr，docs仓评审合并826个pr，blog仓提交21个pr，blog仓评审合并64个pr。"
      - name: "童美霞"
        company: "中软"
        avatar: "./images/2023_tongmeixia.png"
        comment:
          - "参与openGauss 5.0.0资料大纲重构，修改文件夹名及相关内容，完成数据迁移、工具命令参考、dolphin Extension、PostGIS Extension、附录、快速入门文件调整；修改重构产生的断链2000+，并回合修改到master；505.0和505.1版本，需求处理：102个，按照特性跟踪开发：确认开发合入内容正确和完整，补充相关特性描述。（协调合作伙伴、openGauss、内核多方开发进行资料写作和优化）。修改完成后按照模块组织评审，和各模块SE、TSE、版本经理等人评审无异议后完成合入。提交pr200+个，合并pr 500+个。"
      - name: "刘洋"
        company: "软通"
        avatar: "./images/2023_liuyang.png"
        comment:
          - "2023年合入PR 65+，评论30+，支持SIG组维护openGauss基础设施服务，支撑openGauss社区漏洞修复、etherpad、官网、文档等基础设施服务升级，保证openGauss基础设施服务安全稳定。"
      - name: "薛蒙恩"
        company: "华为"
        avatar: "./images/2023_xuemengen.png"
        comment:
          - "积极参与社区om仓issue修复、代码提交等，主要参与升级、扩缩容、流式容灾等模块的issue修复和需求开发，共提PR 40+，修复issue20+。"
      - name: "郭委"
        company: "华为"
        avatar: "./images/2023_guowei.png"
        comment:
          - "1. 在openGauss-dbmind社区提交23个pr,26个issue反馈，实现索引推荐、SQL改写与优化及轻量化Exporter等特性，有力支撑openGauss开发者大会演示及企业客户应用。"
          - "2. 对海量局点进行dbmind培训，包括架构介绍、web界面的功能讲解以及解答海量dbmind部署与使用过程中的相关疑问。"
          - "3. 其他培训和维护为远程会议和现场支撑，有力推广openGauss生态。"
      - name: "梁燕"
        company: "海量数据"
        avatar: "./images/2023_liangyan.png"
        comment:
          - "1. 提交issue，年度个数：229，issue涵盖代码仓：Server仓，OM仓，doc仓，CM仓。"
          - "2. 缺陷转需求，年度个数：10。"
          - "3. 参与社区需求测试与评审，参与社区缺陷分析，并分享；参与社区issue讨论会议。"
      - name: "肖雪"
        company: "恩墨"
        avatar: "./images/2023_xiaoxue.png"
        comment:
