          - "1. 全程参与DataKit 业务开发插件所有版本的需求设计工作，完成了15个需求合入。"
          - "2. 贡献7个pr合入。"
          - "3. 处理与跟进DataKit 业务开发Issue修复共24个。"
          - "4. 向openGauss/openGauss-server提出3个Issue反馈。"
