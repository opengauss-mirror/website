# what_is_rag: "What Is RAG" section
#   title: section title
#   description: section description
what_is_rag:
  title: What Is RAG?
  description: 'Retrieval-Augmented Generation (RAG) combines information retrieval with LLM generation. Its "retrieve-then-generate" paradigm significantly boosts accuracy, speed, and reliability in QA, analysis, and content creation.'

