# what_is_rag: “RAG是什么”板块
#   title: 板块标题
#   description: 板块描述
what_is_rag:
  title: RAG是什么
  description: '检索增强生成（Retrieval-Augmented Generation，简称RAG），是一种将信息检索技术与大语言模型生成能力相结合的先进人工智能技术。它通过“先检索、再生成”的范式，显著提升了AI在问答、分析和创作任务中的准确性、时效性与可靠性。'

