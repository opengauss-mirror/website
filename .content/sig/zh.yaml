- sig_name: ReleaseManagement
  mailing_list: releasemanagement@opengauss.org
  description: ReleaseManagement的主要工作是通过社区协同各SIG maintainer，规划openGauss社区版本的发布工作，为最终的竞争力目标达成负责，其主要职责如下： · 规划openGauss版本总体的转测试、发布时间和阶段性交付目标 · 细粒度跟踪 特性的交付状态，支撑关键特性按规划交付 · 发布协调（在QA，发布工程师，技术委员会等范围内），参与相关组和发布相关等会议 · 负责openGauss项目的交付过程协调
  mailweb_link: https://mailweb.opengauss.org/postorius/lists/releasemanagement.opengauss.org
  archive_link: https://mailweb.opengauss.org/hyperkitty/list/releasemanagement@opengauss.org
