# 版本元数据 / Version Metadata
#
# 字段说明：
#   version_name             版本号显示名（如 "7.0.0-RC3"、"6.0.5 (LTS)"）
#   new_layout               是否使用新版布局（可选）
#   is_login                 是否需要登录才能下载（可选）
#   data_file                对应版本数据文件名（不含扩展名）
#   release_date             发布日期
#   planned_eol              计划终止维护日期
#   desc_zh/en               中英文版本描述（可选）
#   init_previous            历史版本页默认选中版本（可选，仅一个版本设置）
#   version_capability_path  版本能力矩阵文档链接（可选，含占位符 {GITCODE} / {DOCS_ORIGIN}）
#   release_notes_docs       发行说明链接（可选，含占位符）
#   docs_list                相关文档列表（可选）
#     name_zh/en             中英文文档名
#     path_zh/en             中英文文档路径

