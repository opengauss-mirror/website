# Distribution Certification page data
#
# banner: Page top banner
#   title: Title
#   background: Background image
#   illustration: Illustration
# search_placeholder: Search placeholder text
# table_headers: Table column headers
#   pro: Product
#   name: Vendor
#   version: Community Version
#   award: Date Certificate Issued
#   certificate: Product Certificate
# certify: Download certificate button text
# introduce: Bottom introduction
#   text: Introduction text (first part)
#   link_text: Link text
#   link_href: Link URL
# certifications: Certification list data
#   - pro: Commercial distribution name
#     name: Company name
#     version: openGauss community version
#     award: Date certificate issued
#     expiration: Certificate validity expiration date
#     certificate: Certificate download link

banner:
  title: Distribution Certification
  background: ./images/banner-secondary.png
  illustration: ./images/certification.png

search_placeholder: Product, Community Version

table_headers:
