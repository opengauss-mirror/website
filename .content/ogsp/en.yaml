# Service Partner Certification page data
#
# banner: page top banner
#   title: title
#   background: background image
#   illustration: illustration image
# search_placeholder: search box placeholder text
# table_headers: table column headers
#   name: vendor name
#   version: certification number
#   award: issued date
#   expiration: expired date
#   patch: bug fixing and patch release
#   content: service contents
#   system: service system
#   commitment: service commitment
#   experience: project experience
#   certificate: product certificate
# certify: download certificate button text
# tips: footer tips
#   text: tips text (first part)
#   link_text: link text
#   link_href: link URL
# certifications: certification list data
#   - name: company name
#     version: certification number
#     award: issued date
#     expiration: expired date
#     patch: patch mark
#     content: service content rating
#     system: service system rating
#     commitment: service commitment rating
#     experience: project experience rating
#     certificate: certificate download link

banner:
  title: oGSP Certification
  background: ./images/banner-secondary.png
  illustration: ./images/ogsp.png

search_placeholder: Company name

table_headers:
  name: Vendor
  version: Certification Number
  award: Issued Date
  expiration: Expired Date
  patch: Bug Fixing and Patch Release
  content: Service Contents
  system: Service System
  commitment: Service Commitment
  experience: Project Experience
  certificate: Product Certificate

certify: Download

tips:
  text: For openGauss service partner certification, openGauss provides complete evaluation standards and processes, see
  link_text: openGauss Service Partner Certification Overview
  link_href: https://gitcode.com/opengauss/service-partner-certification

