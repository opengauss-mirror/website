# 服务商认证页面数据
#
# banner: 页面顶部 banner
#   title: 标题
#   background: 背景图
#   illustration: 插图
# search_placeholder: 搜索框占位文本
# table_headers: 表头列标题
#   name: 公司名称
#   version: 证书编号
#   award: 颁发日期
#   expiration: 有效截止日期
#   patch: BUG修复与补丁版本发布
#   content: 服务内容
#   system: 服务体系
#   commitment: 服务承诺
#   experience: 项目经验
#   certificate: 认证证书
# certify: 下载证书按钮文本
# tips: 底部提示
#   text: 提示前半段文本
#   link_text: 链接文本
#   link_href: 链接地址
# certifications: 认证列表数据
#   - name: 公司名称
#     version: 证书编号
#     award: 颁发日期
#     expiration: 有效截止日期
#     patch: 补丁标记
#     content: 服务内容评级
#     system: 服务体系评级
#     commitment: 服务承诺评级
#     experience: 项目经验评级
#     certificate: 证书下载链接

banner:
  title: 服务商认证
  background: ./images/banner-secondary.png
  illustration: ./images/ogsp.png

search_placeholder: 认证的公司名称

table_headers:
  name: 公司名称
  version: 证书编号
  award: 颁发日期
  expiration: 有效截止日期
  patch: BUG修复与补丁版本发布
  content: 服务内容
  system: 服务体系
  commitment: 服务承诺
  experience: 项目经验
  certificate: 认证证书

certify: 下载证书

