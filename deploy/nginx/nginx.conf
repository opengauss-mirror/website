user $NGINX_USER;

error_log /dev/stdout info;

pid /var/run/nginx.pid;

worker_processes 2;
worker_rlimit_nofile 4096;
events {
  use epoll;
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
  '$status $body_bytes_sent "$http_referer" '
  '"$http_user_agent" "$http_x_forwarded_for"';

  access_log /dev/stdout main;

  server_tokens off;

  autoindex off;

  port_in_redirect off;
  absolute_redirect off;

  client_header_buffer_size 1k;
  large_client_header_buffers 4 8k;
  client_body_buffer_size 1K;
  client_max_body_size 1k;

  client_header_timeout 8;
  client_body_timeout 8;
  client_body_in_file_only off;

  keepalive_timeout 5 5;
  send_timeout 8;

  proxy_hide_header X-Powered-By;
  proxy_request_buffering off;

  limit_conn_zone $binary_remote_addr zone=limitperip:10m;
  limit_req_zone $binary_remote_addr zone=ratelimit:10m rate=1000r/s;

  gzip on;
  gzip_min_length 1k;
  gzip_buffers 4 16k;
  gzip_comp_level 5;
  gzip_types text/plain application/x-javascript text/css application/xml text/javascript application/javascript application/x-httpd-php application/json;
  gzip_vary on;

  server {
    listen 8080 ssl default_server;
    server_name  opengauss.myopeninfra.com;
    charset utf-8;

    add_header X-XSS-Protection "1; mode=block";
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains";
    add_header Content-Security-Policy "script-src 'self' *.baidu.com 'unsafe-inline'; object-src 'none'; frame-src 'none'";
    add_header Cache-Control "no-cache,no-store,must-revalidate";
    add_header Pragma no-cache;
    add_header Expires 0;
    add_header Referrer-Policy "no-referrer";

    limit_conn limitperip 10;
    ssl_session_tickets off;
    ssl_session_timeout 5m;
    ssl_session_cache shared:SSL:10m;
    ssl on;
    ssl_certificate "cert/server.crt";
    ssl_certificate_key "cert/server.key";
    ssl_password_file "cert/password.txt";
    ssl_dhparam "cert/dhparam.pem";
    ssl_ecdh_curve auto;
    ssl_protocols TLSv1.2;
    ssl_ciphers "ECDHE-RSA-AES256-GCM-SHA384";
    ssl_prefer_server_ciphers on;
    if ($request_method !~ ^(GET|HEAD|POST|PUT|DELETE)$) {
      return 444;
    }

    location = / {
      return 301 https://opengauss.myopeninfra.com/zh/;
    }

    location ~ /\. {
      deny all;
      return 404;
    }

    location / {
      limit_req zone=ratelimit burst=5 nodelay;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Host $host;
      location /assets {
        add_header X-XSS-Protection "1; mode=block";
        add_header X-Frame-Options DENY;
        add_header X-Content-Type-Options nosniff;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains";
        add_header Content-Security-Policy "script-src 'self' *.baidu.com 'unsafe-inline' 'unsafe-eval' ; object-src 'none'; frame-src 'none'";
        add_header Cache-Control "public,max-age=1209600";
        add_header Referrer-Policy "no-referrer";
      }

      root /usr/share/nginx/www;
      index index.html;
    }

    location /api-search/ {
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Host $host;
      add_header X-XSS-Protection "1; mode=block";
      add_header X-Frame-Options DENY;
      add_header X-Content-Type-Options nosniff;
      add_header Content-Security-Policy "script-src 'self'; object-src 'none'; frame-src 'none'";
      add_header Cache-Control "no-cache,no-store,must-revalidate";
      add_header Pragma no-cache;
      add_header Expires 0;
      add_header Referrer-Policy "no-referrer";

      proxy_pass https://doc-search-opengauss.osinfra.cn/;
    }

    location /api-meeting/ {
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Host $host;
      add_header X-XSS-Protection "1; mode=block";
      add_header X-Frame-Options DENY;
      add_header X-Content-Type-Options nosniff;
      add_header Content-Security-Policy "script-src 'self'; object-src 'none'; frame-src 'none'";
      add_header Cache-Control "no-cache,no-store,must-revalidate";
      add_header Pragma no-cache;
      add_header Expires 0;
      add_header Referrer-Policy "no-referrer";

      proxy_pass https://meeting-opengauss.osinfra.cn/;
    }

    location /api-cve/ {
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Host $host;
      add_header X-XSS-Protection "1; mode=block";
      add_header X-Frame-Options DENY;
      add_header X-Content-Type-Options nosniff;
      add_header Content-Security-Policy "script-src 'self'; object-src 'none'; frame-src 'none'";
      add_header Cache-Control "no-cache,no-store,must-revalidate";
      add_header Pragma no-cache;
      add_header Expires 0;
      add_header Referrer-Policy "no-referrer";

      proxy_pass https://cve-opengauss.osinfra.cn/cve-manager/;
    }

    error_page 401 402 403 405 406 407 413 414 /error.html;
    error_page 404 /404.html;
    error_page 500 501 502 503 504 505 /error.html;

    location = /404.html {
      root /usr/share/nginx/www;
    }

    location = /error.html {
      root /usr/share/nginx/www;
    }
  }
}
